version: '3.8'

services:
  data-engine:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.data-engine
    container_name: apnileap-data-engine
    ports:
      - "3003:3003"
    environment:
      - NODE_ENV=production
      - DATA_ENGINE_PORT=3003
      - DATA_DIR=/data
      - JWT_SECRET=apnileap-prod-jwt-secret-key-32-chars-2026
      - INTERNAL_SERVICE_SECRET=internal-service-auth-key-2026-secure
      - TEAM_A_URL=http://eligibility:3001
      - TEAM_B_URL=http://ranking:3002
      - SEED_ON_START=true
    volumes:
      - apnileap-data:/data
    networks:
      - apnileap-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3003/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  eligibility:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.eligibility
    container_name: apnileap-eligibility
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - ELIGIBILITY_PORT=3001
      - JWT_SECRET=apnileap-prod-jwt-secret-key-32-chars-2026
      - INTERNAL_SERVICE_SECRET=internal-service-auth-key-2026-secure
      - DATA_ENGINE_URL=http://data-engine:3003
      - RANKING_URL=http://ranking:3002
    depends_on:
      data-engine:
        condition: service_healthy
    networks:
      - apnileap-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  ranking:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.ranking
    container_name: apnileap-ranking
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=production
      - RANKING_PORT=3002
      - JWT_SECRET=apnileap-prod-jwt-secret-key-32-chars-2026
      - INTERNAL_SERVICE_SECRET=internal-service-auth-key-2026-secure
      - DATA_ENGINE_URL=http://data-engine:3003
      - ELIGIBILITY_URL=http://eligibility:3001
    depends_on:
      data-engine:
        condition: service_healthy
    networks:
      - apnileap-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3002/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  bff:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.bff
    container_name: apnileap-bff
    ports:
      - "3004:3004"
    environment:
      - NODE_ENV=production
      - BFF_PORT=3004
      - JWT_SECRET=apnileap-prod-jwt-secret-key-32-chars-2026
      - INTERNAL_SERVICE_SECRET=internal-service-auth-key-2026-secure
      - ELIGIBILITY_URL=http://eligibility:3001
      - RANKING_URL=http://ranking:3002
      - DATA_ENGINE_URL=http://data-engine:3003
      - CORS_ORIGINS=http://localhost,http://localhost:80,http://localhost:5173
    depends_on:
      data-engine:
        condition: service_healthy
      eligibility:
        condition: service_healthy
      ranking:
        condition: service_healthy
    networks:
      - apnileap-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3004/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  web:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.web
    container_name: apnileap-web
    ports:
      - "80:80"
    depends_on:
      bff:
        condition: service_healthy
    networks:
      - apnileap-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

volumes:
  apnileap-data:
    name: apnileap-data-volume

networks:
  apnileap-net:
    driver: bridge
